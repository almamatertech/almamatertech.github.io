---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="post-date">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </p>
    <h1>{{ page.title | escape }}</h1>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
